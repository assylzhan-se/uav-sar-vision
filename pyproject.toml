[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-vision"
version = "0.2.0"
description = "Machine vision for UAV-based search and rescue (diploma project)"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3",
    "sahi>=0.11",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
